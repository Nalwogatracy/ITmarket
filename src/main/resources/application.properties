# ========== Logging ==========
logging.level.com.IT_market=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.file.name=logs/it-market.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ========== Swagger/OpenAPI ==========
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# ========== Actuator ==========
#management.endpoints.web.exposure.include=health,info,metrics
#management.endpoint.health.show-details=always

# ========== JVM Memory Optimization ==========
# CRITICAL FOR NANO TIER
# Initial heap size - start as low as possible
JAVA_TOOL_OPTIONS=-Xms64m -XX:MaxRAM=250m -XX:+UseSerialGC -Dfile.encoding=UTF-8

# Heap dump on OOM for debugging (disable in production)
JAVA_OPTS=-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp

# Spring Boot optimizations
spring.main.lazy-initialization=true
spring.main.banner-mode=off
spring.jmx.enabled=false

# Database connection pool - smaller for Nano
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# Disable JPA features you don't need
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false