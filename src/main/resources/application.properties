# ========== Application Configuration ==========
spring.application.name=IT_market

# ========== Database Configuration ==========
# Neon PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-young-art-aho37beu-pooler.c-3.us-east-1.aws.neon.tech/ITmarket?sslmode=require&channel_binding=require}
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASS:npg_JlQ1Cxia6fRA}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========== JPA / Hibernate ==========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ========== Server Configuration ==========
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.servlet.context-path=/

# ========== Email Configuration ==========
spring.mail.host=smtp.sendgrid.net
spring.mail.port=587
spring.mail.username=online_market
spring.mail.password=${SENDGRID_API_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# ========== File Upload ==========
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true

# ========== Redis Configuration ==========
pring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=60000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# ========== Cache Configuration ==========
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# ========== JWT Configuration ==========
app.jwt.secret=${JWT_SECRET:your-super-secret-jwt-key-change-this-in-production}
app.jwt.expiration=86400000

# ========== Application Settings ==========
# TODO: Replace with cloud storage - /tmp is ephemeral!
app.upload.dir=${UPLOAD_DIR:/tmp/uploads}  
app.admin.email=admin@techsphere.com
app.admin.phone=+1234567890
app.order.notification.email-enabled=true
app.order.notification.sms-enabled=false

# ========== Thymeleaf ==========
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ========== Logging ==========
logging.level.com.IT_market=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.file.name=logs/it-market.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ========== Swagger/OpenAPI ==========
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# ========== Actuator ==========
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always